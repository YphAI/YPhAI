<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ⚠️ 登入驗證檢查，必須最先執行、不可加 defer/async，確保未登入時立刻跳轉 -->
    <script src="auth-guard.js"></script>

    <title>醫療輔助系統</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container header">
        <div class="icon-box">🏥</div>
        <div>
            <h1>臨床語音紀錄與分析</h1>
            <p>阮綜合藥局專用 - 智慧輔助系統</p>
        </div>
    </div>

    <div class="container">
        <div class="section-title">
            <span>📝 病患主訴與臨床紀錄</span>
        </div>

        <div id="categoryTabs" class="category-tabs">
            <span style="font-size: 0.85rem; color: #94a3b8;">載入標籤中...</span>
        </div>

        <div class="label-group" style="margin-top: 10px; margin-bottom: 8px;">
            <label style="font-size: 0.85rem; color: #64748b;">✍️ 輸入內容</label>
            <button onclick="clearClinicalInput()" class="btn-copy" style="color: #dc2626; border-color: #fca5a5; background: #fef2f2;">🗑️ 一鍵清空</button>
        </div>

        <textarea id="clinicalInput" rows="2" placeholder="請語音或手動輸入..." oninput="autoResize(this)" autocomplete="off"></textarea>

        <div class="btn-group">
            <button id="mobileSyncBtn" class="btn-mic" style="background: #fef3c7; color: #b45309; border-color: #fde68a;">📱 手機配對</button>
            <button id="longAudioBtn" class="btn-mic" style="background: #fdf2f8; color: #db2777; border-color: #fbcfe8;">⏺️ 長段錄音</button>
            <button id="micBtn" class="btn-mic">🎙️ 短句即時</button>
            <button id="pcCameraBtn" class="btn-mic" style="background: #3b82f6; color: white; border-color: #2563eb;">📷 拍照</button>
            <button id="pcGalleryBtn" class="btn-mic" style="background: #6366f1; color: white; border-color: #4f46e5;">🖼️ 相簿</button>

            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
            <input type="file" id="galleryInput" accept="image/*" style="display: none;">

            <button id="micromedexBtn" class="btn-mic" style="background: #e0e7ff; color: #4338ca; border-color: #c7d2fe;">🔗 Micromedex</button>
            <button id="analyzeBtn" class="btn-analyze">✨ 送出分析</button>
        </div>
    </div>

    <div class="container relative">
        <div class="section-title">
            <span>📋 HIS 系統格式產出</span>
            <span id="categoryBadge" class="category-badge">🏷️ 尚未分類</span>
        </div>

        <div class="output-box">
            <div id="loadingMask" class="loading-mask">
                ⏳ 醫療大腦運算中，請稍候...
            </div>

            <div>
                <div class="label-group">
                    <label>問題敘述</label>
                    <button onclick="copyContent('problemOutput', this)" class="btn-copy">📋 複製問題</button>
                </div>
                <textarea id="problemOutput" rows="1" placeholder="AI 分析後的問題將顯示於此..." autocomplete="off"></textarea>
            </div>

            <div>
                <div class="label-group">
                    <label>回覆內容</label>
                    <button onclick="copyContent('replyOutput', this)" class="btn-copy">📋 複製回覆</button>
                </div>
                <textarea id="replyOutput" rows="1" placeholder="AI 分析後的回覆將顯示於此..." autocomplete="off"></textarea>
            </div>

            <div id="reviewActions" style="display:none; gap:8px;">
                <button id="keepRecordBtn" class="btn-analyze" style="background:#10b981;">💾 留存紀錄</button>
                <button id="discardRecordBtn" class="btn-mic" style="background:#fee2e2; color:#b91c1c; border-color:#fca5a5;">❌ 忽略</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">訊息提示</div>

    <div id="qrModal" class="qr-modal">
        <h2 style="color: #0f172a; margin-bottom: 5px;">📱 手機語音遙控器</h2>
        <p style="color: #64748b; margin-top: 0;">請用手機相機掃描下方條碼</p>
        <img id="qrImage" src="" alt="QR Code">
        <p style="color: #ef4444; font-weight: bold;">配對中... 掃描後請直接在手機上輸入</p>
        <button onclick="stopSync()" class="btn-copy" style="padding: 10px 20px; font-size: 1rem;">❌ 關閉並停止同步</button>
    </div>

    <!--
        ⚠️ 載入順序很重要：
        1. config.js         — 共用常數 / DOM 參照 / 工具函式，必須最先載入
        2. tags-and-analyze.js
        3. speech-short.js
        4. audio-long.js
        5. image-upload.js
        6. mobile-sync.js    — 手機配對，且會在手機端整個換掉 <body>，放最後
    -->
    <script src="js/config.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/audio-long.js"></script>
    <script src="js/speech-short.js"></script>
    <script src="js/image-upload.js"></script>
    <script src="js/tags-and-analyze.js"></script>
    <script src="js/mobile-sync.js"></script>
</body>
</html>
